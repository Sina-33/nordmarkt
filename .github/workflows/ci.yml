name: CI

on:
  push: {branches: [main]}
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nordmarkt
          POSTGRES_PASSWORD: nordmarkt
          POSTGRES_DB: nordmarkt_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]

    env:
      NM_DATABASE_URL: postgresql+asyncpg://nordmarkt:nordmarkt@localhost:5432/nordmarkt_test
      NM_REDIS_URL: redis://localhost:6379/1
      NM_JWT_SECRET: ci-secret-that-is-definitely-long-enough
      NM_ENVIRONMENT: ci

    defaults:
      run: {working-directory: backend}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e ".[dev]"
      - run: ruff check app tests
      - run: ruff format --check app tests
      - run: mypy app
      - run: alembic upgrade head
      - run: pytest --cov=app --cov-report=term-missing --cov-fail-under=25

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: frontend}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
